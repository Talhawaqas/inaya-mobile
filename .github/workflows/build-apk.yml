name: Build Android APK

# Manual only. Builds the Google Play edition of the app through EAS's own cloud build service
# (eas-cli, not a local Gradle build), using the Android signing credentials EAS already has on
# file for this project's "production" profile -- the same key this app was originally published
# with. Needs one repo secret: EXPO_TOKEN (Settings -> Secrets and variables -> Actions -> New
# repository secret), an Expo access token from https://expo.dev/accounts/[account]/settings/
# access-tokens. That token authenticates this job to Expo's build service; it is not the Android
# keystore or its password, and neither of those two ever exists on this runner, on GitHub, or on
# any local machine -- EAS signs the bundle entirely on its own infrastructure.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Build and sign on EAS's cloud (profile "play-remote" -- Play edition env vars, production's signing credentials)
        run: eas build --platform android --profile play-remote --non-interactive --wait --json > eas-build-result.json

      - name: Download the signed bundle EAS produced
        run: |
          URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('eas-build-result.json','utf8'))[0].artifacts.buildUrl)")
          echo "Downloading $URL"
          mkdir -p android/app/build/outputs/bundle/release
          curl -L "$URL" -o android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: inaya-play-edition-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
