name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger this manually from GitHub's Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    # These are EXPO_PUBLIC_ values — meant to be embedded in the client
    # bundle, not secrets (Google OAuth "Client ID"s and a WalletConnect
    # project ID are public identifiers by design, unlike a client secret).
    # Set at job level so every step sees them, in particular the Gradle
    # build step below: this pipeline builds via `expo prebuild` + a direct
    # Gradle build, NOT `expo start`/`expo export` — those Expo-CLI commands
    # auto-load a local .env file, but a direct Gradle build bypasses that
    # entirely and only sees real process environment variables. The local
    # .env file (gitignored, never committed) is invisible to this workflow,
    # so these have to be set here explicitly or the JS bundle Gradle embeds
    # ends up with every EXPO_PUBLIC_* value undefined.
    env:
      EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID: fe5441b91ed1d12a68c3f34e18bb75c2
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: 689943698003-3eb2hmpjfflp5atmq6i5k7fo7hlmg0iv.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID: 689943698003-b991hqvg7rhgip76k8tuvhmvlrt98sig.apps.googleusercontent.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (required for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android

      - name: Restore the stable signing keystore (release build signs with it, since this is an alpha, not a Play Store submission)
        # Every run on ubuntu-latest starts on a fresh, empty runner — there
        # is no persisted ~/.android/debug.keystore to reuse between builds.
        # Generating a fresh one here on every run (the old approach) meant
        # the signing fingerprint changed on every single build, which
        # breaks anything tied to that fingerprint — specifically, Google
        # Sign-In's Android OAuth client registration, which is pinned to
        # one exact SHA-1. Restoring the SAME keystore from a repo secret
        # keeps the fingerprint stable across builds.
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build APK (release — embeds the JS bundle, no dev server required at runtime)
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: List actual build output (diagnostic — shows real filenames/paths if anything unexpected happens)
        run: find android/app/build/outputs -type f -name "*.apk"

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: inaya-mobile-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
